[project]
name = "argus"
version = "0.1.0"
description = "Argus — an LLM computes textual gradients to tune a RAG pipeline (LLM-as-optimizer over a retrieval cascade)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "anthropic>=0.40",   # the optimizer brain (--brain anthropic); key loaded from .env
]

[project.scripts]
argus = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["argus"]
